name: Build x64 Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать билд вручную из вкладки Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build solution (x64 Release)
      run: msbuild majorkahook.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload x64 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: majorkahook-x64-dll
        path: |
          x64/Release/*.dll
