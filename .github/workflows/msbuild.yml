name: Build majorkahook x86 Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную из вкладки Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution (x86 Release)
      run: |
        msbuild majorkahook.sln /p:Configuration=Release /p:Platform=x86 /p:DefineConstants="_CRT_SECURE_NO_WARNINGS" /p:TreatWarningsAsErrors=false

    - name: Upload Compiled DLL
      uses: actions/upload-artifact@v4
      with:
        name: majorkahook-x86
        path: |
          Release/*.dll
          bin/Release/*.dll
          x86/Release/*.dll
